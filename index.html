        :root {
            --cream: #EFEEEA;
            --cream-soft: #F7F7F5;
            --terra: #E39138;
            --terra-dark: #C97F1E;
            --olive: #6B8F76;
            --olive-dark: #3F6349;
            --olive-soft: #DCE7DE;
            --charcoal: #26313D;
            --navy: #223447;
            --navy-deep: #121C26;
            --ink-70: #454A4E;
            --ink-40: #8B8F91;
            --rust: #B23A2E;
            --rust-soft: #F1D9D3;
            --border: #DCDCD5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--cream);
            color: var(--charcoal);
            overflow-x: hidden;
        }

        header {
            position: relative;
            background: linear-gradient(160deg, var(--navy), var(--navy-deep));
            color: var(--cream);
            padding: 0.65rem 1rem 1.4rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 10px rgba(18, 28, 38, 0.35);
        }

        header::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 7px;
            background: repeating-linear-gradient(
                90deg,
                var(--navy-deep) 0px, var(--navy-deep) 2px,
                var(--terra) 2px, var(--terra) 3px,
                var(--navy-deep) 3px, var(--navy-deep) 6px,
                var(--terra) 6px, var(--terra) 7px,
                var(--navy-deep) 7px, var(--navy-deep) 8px,
                var(--terra) 8px, var(--terra) 11px,
                var(--navy-deep) 11px, var(--navy-deep) 13px
            );
            opacity: 0.35;
        }

        .header-date {
            text-align: center;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            color: var(--terra);
            opacity: 0.9;
            margin-bottom: 0.5rem;
        }

        .brand {
            position: relative;
            text-align: center;
            margin-bottom: 1rem;
        }

        header h1 {
            font-family: 'Big Shoulders Bold', 'Arial Narrow', sans-serif;
            font-weight: 700;
            font-size: 2.5rem;
            line-height: 0.85;
            letter-spacing: -0.01em;
            color: var(--cream);
            text-align: center;
        }

        .subtitle-stamp {
            display: inline-block;
            margin-top: 0.1rem;
            background-color: rgba(255, 255, 255, 0.06);
            color: var(--terra);
            border: 1px solid var(--terra-dark);
            border-radius: 3px;
            padding: 0.08rem 0.55rem;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* Search Bar */
        .search-container {
            margin-top: 1rem;
            margin-bottom: 1rem;
            padding: 0 1rem;
        }

        .search-bar {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid var(--border);
            border-radius: 20px;
            font-size: 1rem;
            background-color: #fff;
            color: var(--charcoal);
            transition: border-color 0.3s ease;
        }

        .search-bar:focus {
            outline: none;
            border-color: var(--terra-dark);
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 0.6rem;
            padding: 1rem;
            background-color: var(--cream-soft);
        }

        .tab-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
            padding: 0.6rem 0.4rem;
            border: 1.5px solid var(--terra-dark);
            background-color: var(--terra-dark);
            color: #fff;
            font-family: inherit;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.2s ease;
            box-shadow: 0 3px 8px rgba(201, 127, 30, 0.3);
        }

        .tab-label {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.01em;
        }

        .tab-count {
            font-family: 'Courier New', monospace;
            font-size: 1.15rem;
            font-weight: 700;
            line-height: 1;
        }

        .tab-btn.inactive {
            background-color: #fff;
            border-color: var(--border);
            color: var(--ink-70);
            box-shadow: none;
        }

        .tab-btn.inactive .tab-count {
            color: var(--charcoal);
        }

        .tab-btn:active {
            transform: scale(0.97);
        }

        /* Processed Date Filters */
        .date-filter-btn {
            padding: 0.4rem 0.8rem;
            border: 1.5px solid var(--border);
            background-color: #fff;
            color: var(--ink-70);
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 999px;
            transition: all 0.2s ease;
        }

        .date-filter-btn:active {
            transform: scale(0.96);
        }

        .date-filter-btn.active {
            background-color: var(--terra-dark);
            border-color: var(--terra-dark);
            color: #fff;
        }

        /* Add Product Button */
        .add-btn {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: var(--terra-dark);
            color: white;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(196, 108, 66, 0.4);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .add-btn:active {
            transform: scale(0.95);
        }

        /* Product List */
        .product-list {
            list-style: none;
            padding: 1rem;
        }

        .product-item {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            padding: 0.85rem;
            background-color: #fff;
            border: 1px solid var(--border);
            border-radius: 16px;
            margin-bottom: 0.75rem;
            transition: all 0.3s ease;
        }

        /* Single-date products that are within the critical window get the
           whole card turned red, not just an inner row */
        .product-item.product-item-critical {
            background-color: var(--rust);
            border-color: var(--rust);
        }

        .product-item.product-item-critical .product-name,
        .product-item.product-item-critical .product-quantity,
        .product-item.product-item-critical .batch-date,
        .product-item.product-item-critical .batch-qty {
            color: #fff;
        }

        .product-item.product-item-critical .batch-qty.qty-unknown {
            color: rgba(255, 255, 255, 0.75);
        }

        .product-item.product-item-critical .edit-btn {
            color: #fff;
        }

        .product-item.product-item-critical .batch-row:not(.batch-row-pending) {
            background-color: transparent;
            border: none;
            padding: 0;
        }

        .product-item.product-item-critical .days-critical {
            background-color: #fff;
            color: var(--rust);
        }

        .product-item.product-item-critical input[type="checkbox"] {
            background-color: #fff;
        }

        .product-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.75rem;
        }

        .product-info {
            flex: 1;
            min-width: 0;
        }

        .product-name {
            font-weight: 600;
            margin-bottom: 0.15rem;
            font-size: 0.95rem;
            word-break: break-word;
        }

        .product-quantity {
            font-size: 0.85rem;
            color: var(--ink-70);
        }

        .batch-list {
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
        }

        .batch-row {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.65rem 0.6rem;
            border-radius: 10px;
            background-color: var(--cream-soft);
            border: 1px solid var(--border);
        }

        .batch-row.batch-critical {
            background-color: var(--rust-soft);
            border-color: var(--rust);
        }

        .batch-row.batch-row-pending {
            display: block;
            background-color: #fff;
            border-color: var(--terra-dark);
            padding: 0.75rem;
        }

        .pending-log {
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
        }

        .pending-log-title {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--terra-dark);
        }

        .batch-row input[type="checkbox"] {
            width: 28px;
            height: 28px;
            cursor: pointer;
            accent-color: var(--rust);
            flex-shrink: 0;
            border-radius: 6px;
        }

        .batch-row input[type="checkbox"]:checked {
            accent-color: var(--olive-dark);
        }

        .batch-info {
            flex: 1;
            min-width: 0;
        }

        .batch-date {
            font-size: 1rem;
            font-weight: 700;
            color: var(--charcoal);
        }

        .batch-qty {
            font-size: 0.82rem;
            color: var(--ink-70);
        }

        .batch-qty.qty-unknown {
            color: var(--ink-40);
            font-style: italic;
        }

        .days-pill {
            display: inline-block;
            padding: 0.3rem 0.65rem;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 700;
            white-space: nowrap;
            letter-spacing: 0.01em;
            flex-shrink: 0;
        }

        .days-critical {
            background-color: var(--rust);
            color: #fff;
        }

        .days-normal {
            background-color: rgba(232, 149, 106, 0.18);
            color: var(--terra-dark);
        }

        .edit-btn {
            background: none;
            border: none;
            color: var(--terra-dark);
            font-size: 1.35rem;
            cursor: pointer;
            padding: 0.5rem;
            margin: -0.5rem;
            flex-shrink: 0;
            transition: transform 0.2s ease;
        }

        .edit-btn:active {
            transform: scale(0.9);
        }

        .empty-state {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--ink-40);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.6;
        }

        /* Processed Items */
        .processed-card {
            background-color: #fff;
            border: 1px solid var(--border);
            border-radius: 14px;
            margin-bottom: 0.65rem;
            overflow: hidden;
        }

<body>
    <!-- Header -->

                this.loadProducts();

            setupHeader() {
                const today = new Date();
                const dateStr = today.toLocaleDateString('en-US', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
                document.getElementById('headerDate').textContent = dateStr;
                document.getElementById('headerTitle').textContent = 'BB Tracker';

            loadProducts() {
                const saved = localStorage.getItem('products');
                if (saved) {
                    try {
                        this.products = JSON.parse(saved);
                    } catch {
                        this.products = this.getDefaultProducts();
                    }
                } else {
                    this.products = this.getDefaultProducts();
                }
                this.normalizeProducts();
                this.sortProductsAlphabetically();

            normalizeProducts() {
                // Older saved data stored each date as a plain string with no
                // per-batch quantity. Upgrade those in place so the rest of the
                // app can always assume { date, qty } objects.
                this.products.forEach(product => {
                    product.dates = product.dates.map(entry =>
                        typeof entry === 'string' ? { date: entry, qty: null } : entry
                    );
                    // Self-heal: a product can end up with zero dates left
                    // (e.g. from an older version of the processing logic)
                    // without ever being flagged removed. An empty dates
                    // array crashes date lookups, so repair it here.
                    if (product.dates.length === 0) {
                        product.removed = true;
                    }

            },

            
            getDaysUntilExpiry(dateString) {
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const expiryDate = new Date(dateString);
                expiryDate.setHours(0, 0, 0, 0);
                const timeDiff = expiryDate - today;
                return Math.ceil(timeDiff / (1000 * 3600 * 24));
            },

            getEarliestDate(dates) {
                if (!dates || dates.length === 0) return null;
                return dates.reduce((earliest, current) => {
                    return new Date(current.date) < new Date(earliest.date) ? current : earliest;
                });
            },

            isExpiringCritical(daysUntil) {
                return daysUntil <= 15;
            },

            sortProductsAlphabetically() {
                this.products.sort((a, b) => {
                    if (a.removed === b.removed) {
                        return a.name.localeCompare(b.name, undefined, { sensitivity: 'base' });
                    }
                    return a.removed ? 1 : -1;
                });
            },

            getFilteredProducts() {
                let filtered = this.products.filter(p => !p.removed);

                if (this.currentView === 'expiring') {
                    filtered = filtered.filter(p => {
                        const earliest = this.getEarliestDate(p.dates);
                        if (!earliest) return false;
                        const daysUntil = this.getDaysUntilExpiry(earliest.date);
                        return this.isExpiringCritical(daysUntil);
                    });

                    // Urgency first, not alphabetical — the whole point of
                    // this view is "what needs attention soonest".
                    filtered.sort((a, b) => {
                        const aDate = this.getEarliestDate(a.dates).date;
                        const bDate = this.getEarliestDate(b.dates).date;
                        return new Date(aDate) - new Date(bDate);
                    });
                }

                if (this.searchQuery.trim()) {
                    filtered = filtered.filter(p => 
                        p.name.toLowerCase().includes(this.searchQuery.toLowerCase())
                    );
                }

                return filtered;
            },

            getFilteredProcessedItems() {
                let filtered = this.processedItems;

                if (this.processedDateFilter !== 'all') {
                    const today = new Date();
                    today.setHours(0, 0, 0, 0);
                    let cutoff = null;

                    if (this.processedDateFilter === 'today') {
                        cutoff = new Date(today);
                    } else if (this.processedDateFilter === '7days') {
                        cutoff = new Date(today);
                        cutoff.setDate(cutoff.getDate() - 6);
                    } else if (this.processedDateFilter === '30days') {
                        cutoff = new Date(today);
                        cutoff.setDate(cutoff.getDate() - 29);
                    } else if (this.processedDateFilter === 'month') {
                        cutoff = new Date(today.getFullYear(), today.getMonth(), 1);
                    }

                    if (cutoff) {
                        filtered = filtered.filter(item => {
                            const d = new Date(item.processedDate);
                            d.setHours(0, 0, 0, 0);
                            return d >= cutoff && d <= today;
                        });
                    }
                }

                if (this.searchQuery.trim()) {
                    filtered = filtered.filter(item => 
                        item.name.toLowerCase().includes(this.searchQuery.toLowerCase())
                    );
                }

                return filtered;
            },

            getUnconfirmedCount(items) {
                return items.filter(item => item.unitsRemoved === null || item.unitsRemoved === undefined || item.unitsRemoved === '').length;
            },

            getTotalUnitsRemoved(items) {
                return items.reduce((sum, item) => sum + (parseInt(item.unitsRemoved, 10) || 0), 0);
            },

            buildSummaryText(items) {
                const unconfirmed = this.getUnconfirmedCount(items);
                const totalUnits = this.getTotalUnitsRemoved(items);
                let text = `${items.length} item${items.length === 1 ? '' : 's'} · ${totalUnits} unit${totalUnits === 1 ? '' : 's'} confirmed`;
                if (unconfirmed > 0) {
                    text += ` · ${unconfirmed} need${unconfirmed === 1 ? 's' : ''} a count`;
                }
                return text;
            },

            refreshUnconfirmedBadge(id, unitsRemoved) {
                const badge = document.querySelector(`.needs-count-badge[data-badge-id="${id}"]`);
                if (badge) {
                    const needsCount = unitsRemoved === null || unitsRemoved === undefined || unitsRemoved === '';
                    badge.style.display = needsCount ? 'inline-block' : 'none';
                }
            },

            formatDate(dateString) {
                const date = new Date(dateString);
                return new Intl.DateTimeFormat('en-ZA', { 
                    day: '2-digit', 
                    month: '2-digit', 
                    year: 'numeric' 
                }).format(date);
            },

            formatDateShort(dateString) {
                const date = new Date(dateString);
                return new Intl.DateTimeFormat('en-ZA', { 
                    day: '2-digit', 
                    month: '2-digit', 
                    year: '2-digit' 
                }).format(date);
            },

            render() {
                const list = document.getElementById('productList');
                const processedList = document.getElementById('processedList');
                const emptyState = document.getElementById('emptyState');

                if (this.currentView === 'processed') {
                    list.style.display = 'none';
                    processedList.style.display = 'block';
                    document.getElementById('processedFilterBar').style.display = 'flex';
                    document.getElementById('processedSummary').style.display = 'block';
                    this.renderProcessedItems();
                } else {
                    processedList.style.display = 'none';
                    document.getElementById('processedFilterBar').style.display = 'none';
                    document.getElementById('processedSummary').style.display = 'none';
                    list.style.display = 'block';
                    
                    const filtered = this.getFilteredProducts();

                    list.innerHTML = '';

                    if (filtered.length === 0) {
                        list.style.display = 'none';
                        emptyState.style.display = 'block';
                        document.getElementById('emptyMessage').textContent = 
                            this.currentView === 'expiring' 
                                ? 'No products expiring soon' 
                                : 'No products found';
                        return;
                    }

                    list.style.display = 'block';
                    emptyState.style.display = 'none';

                    filtered.forEach(product => {
                      try {
                        const sortedDates = [...product.dates].sort((a, b) => new Date(a.date) - new Date(b.date));
                        const visibleDates = this.currentView === 'expiring'
                            ? sortedDates.filter(entry => this.isExpiringCritical(this.getDaysUntilExpiry(entry.date)))
                            : sortedDates;

                        if (visibleDates.length === 0) return;

                        // A product with only one date total, and that date is
                        // critical, gets the whole card turned red — not just
                        // an inner row. A product with multiple dates always
                        // stays a white card with per-row indicators instead,
                        // even if the one showing here happens to be critical.
                        const isSingleDateProduct = product.dates.length === 1;
                        const isFullyCritical = isSingleDateProduct &&
                            this.isExpiringCritical(this.getDaysUntilExpiry(product.dates[0].date));

                        const li = document.createElement('li');
                        li.className = `product-item ${isFullyCritical ? 'product-item-critical' : ''}`;

                        const batchRowsHTML = visibleDates.map(entry => {
                            const daysUntil = this.getDaysUntilExpiry(entry.date);
                            const isCritical = this.isExpiringCritical(daysUntil);
                            const daysClass = isCritical ? 'days-critical' : 'days-normal';
                            const daysText = daysUntil <= 0 ? 'EXPIRED' : `${daysUntil} day${daysUntil === 1 ? '' : 's'}`;
                            const hasQty = entry.qty !== null && entry.qty !== undefined && entry.qty !== '';
                            const qtyText = hasQty ? `${entry.qty} unit${entry.qty === 1 ? '' : 's'}` : 'qty unknown';

                            const checkboxHTML = this.currentView === 'expiring' ? `
                                <input 
                                    type="checkbox" 
                                    class="remove-checkbox"
                                    data-id="${product.id}"
                                    data-date="${entry.date}"
                                    data-qty="${entry.qty ?? ''}"
                                    aria-label="Mark as processed"
                                >
                            ` : '';

                            return `
                                <div class="batch-row ${isCritical && !isFullyCritical ? 'batch-critical' : ''}">
                                    ${checkboxHTML}
                                    <div class="batch-info">
                                        <div class="batch-date">${this.formatDate(entry.date)}</div>
                                        <div class="batch-qty ${hasQty ? '' : 'qty-unknown'}">${qtyText}</div>
                                    </div>
                                    <span class="days-pill ${daysClass}">${daysText}</span>
                                </div>
                            `;
                        }).join('');

                        li.innerHTML = `
                            <div class="product-card-header">
                                <div class="product-info">
                                    <div class="product-name">${product.name}</div>
                                    <div class="product-quantity">${product.quantity}</div>
                                </div>
                                ${this.currentView === 'all' ? `<button class="edit-btn" data-id="${product.id}" aria-label="Edit product">✏️</button>` : ''}
                            </div>
                            <div class="batch-list">
                                ${batchRowsHTML}
                            </div>
                        `;

                        list.appendChild(li);
                      } catch (err) {
                        // Never let one malformed product take down the whole
                        // list render — log it and keep going.
                        console.error('Skipped rendering product due to bad data:', product, err);
                      }
                    });

                    this.attachCheckboxListeners();
                    if (this.currentView === 'all') {
                        this.attachEditButtonListeners();
                    }
                }
            },

            renderProcessedItems() {
                const container = document.getElementById('processedList');
                const emptyState = document.getElementById('emptyState');
                const filtered = this.getFilteredProcessedItems();

                container.innerHTML = '';

                if (filtered.length === 0) {
                    container.style.display = 'none';
                    emptyState.style.display = 'block';
                    document.getElementById('emptyMessage').textContent = 'No processed items';
                    return;
                }

                container.style.display = 'block';
                emptyState.style.display = 'none';

                const summaryEl = document.getElementById('processedSummary');
                summaryEl.textContent = this.buildSummaryText(filtered);

                filtered.forEach(item => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'processed-card';
                    const needsCount = item.unitsRemoved === null || item.unitsRemoved === undefined || item.unitsRemoved === '';
                    const subline = item.status
                        ? `${item.status}${needsCount ? '' : ` · ${item.unitsRemoved} unit${item.unitsRemoved === 1 ? '' : 's'}`}`
                        : 'Tap to add details';
                    itemDiv.innerHTML = `
                        <button type="button" class="processed-card-summary">
                            <div class="processed-card-main">
                                <div class="processed-card-name">
                                    ${item.name}
                                    <span class="needs-count-badge" data-badge-id="${item.id}" style="display: ${needsCount ? 'inline-block' : 'none'};">Needs count</span>
                                </div>
                                <div class="processed-card-meta-line">${item.quantity} · Processed ${this.formatDate(item.processedDate)}</div>
                                <div class="processed-card-sub" data-subline-id="${item.id}">${subline}</div>
                            </div>
                            <span class="processed-card-chevron">›</span>
                        </button>
                        <div class="processed-card-detail">
                            <div class="processed-item-meta">
                                <div><strong>Qty:</strong> ${item.quantity}</div>
                                <div><strong>Final Date:</strong> ${this.formatDate(item.expiryDate)}</div>
                                <div><strong>Processed:</strong> ${this.formatDate(item.processedDate)}</div>
                            </div>
                            <div class="processed-item-fields">
                                <div class="processed-field">
                                    <label>Status</label>
                                    <select class="processed-status" data-id="${item.id}">
                                        <option value="">Select status...</option>
                                        <option value="Marked down" ${item.status === 'Marked down' ? 'selected' : ''}>Marked down</option>
                                        <option value="Thrown away" ${item.status === 'Thrown away' ? 'selected' : ''}>Thrown away</option>
                                        <option value="Taken off shelf" ${item.status === 'Taken off shelf' ? 'selected' : ''}>Taken off shelf</option>
                                    </select>
                                </div>
                                <div class="processed-field">
                                    <label>Stock Removed</label>
                                    <input type="number" min="0" inputmode="numeric" class="processed-units" data-id="${item.id}" placeholder="Count not logged yet" value="${item.unitsRemoved ?? ''}">
                                </div>
                                <div class="processed-field">
                                    <label>Notes</label>
                                    <textarea class="processed-notes" data-id="${item.id}" placeholder="Add notes...">${item.notes || ''}</textarea>
                                </div>
                                <div class="processed-actions">
                                    <button class="save-entry-btn" data-id="${item.id}" type="button">Save</button>
                                    <button class="restore-btn" data-id="${item.id}" type="button" aria-label="Restore to inventory">↩ Restore</button>
                                </div>
                            </div>
                        </div>
                    `;
                    container.appendChild(itemDiv);
                });

                document.querySelectorAll('.processed-card-summary').forEach(summaryBtn => {
                    summaryBtn.addEventListener('click', () => {
                        const card = summaryBtn.closest('.processed-card');
                        card.classList.toggle('expanded');
                    });
                });

                this.attachProcessedItemListeners();
            },

            attachCheckboxListeners() {
                document.querySelectorAll('.remove-checkbox').forEach(checkbox => {
                    checkbox.addEventListener('change', (e) => {
                        if (!e.target.checked) return;

                        const id = parseInt(e.target.dataset.id);
                        const dateToProcess = e.target.dataset.date;
                        const qtyAttr = e.target.dataset.qty;
                        const knownQty = (qtyAttr === '' || qtyAttr === undefined) ? null : parseInt(qtyAttr, 10);
                        const product = this.products.find(p => p.id === id);
                        if (!product) return;

                        const batchRow = e.target.closest('.batch-row');
                        batchRow.classList.add('batch-row-pending');
                        batchRow.innerHTML = `
                            <div class="pending-log">
                                <div class="pending-log-title">${this.formatDate(dateToProcess)} — log before saving</div>
                                <div class="processed-field">
                                    <label>Status</label>
                                    <select class="pending-status">
                                        <option value="">Select status...</option>
                                        <option value="Marked down">Marked down</option>
                                        <option value="Thrown away">Thrown away</option>
                                        <option value="Taken off shelf">Taken off shelf</option>
                                    </select>
                                </div>
                                <div class="processed-field">
                                    <label>Stock Removed</label>
                                    <input type="number" min="0" inputmode="numeric" class="pending-qty" placeholder="Leave blank if unsure" value="${knownQty ?? ''}">
                                </div>
                                <div class="processed-field">
                                    <label>Notes</label>
                                    <textarea class="pending-notes" placeholder="Add notes..."></textarea>
                                </div>
                                <div class="processed-actions">
                                    <button type="button" class="pending-cancel-btn">Cancel</button>
                                    <button type="button" class="pending-save-btn">Save to Processed</button>
                                </div>
                            </div>
                        `;

                        batchRow.querySelector('.pending-cancel-btn').addEventListener('click', () => {
                            this.render();
                        });

                        batchRow.querySelector('.pending-save-btn').addEventListener('click', () => {
                            const status = batchRow.querySelector('.pending-status').value;
                            const qtyVal = batchRow.querySelector('.pending-qty').value;
                            const notes = batchRow.querySelector('.pending-notes').value;
                            const finalQty = qtyVal === '' ? null : parseInt(qtyVal, 10);

                            const processedItem = {
                                id: this.generateProcessedId(),
                                productId: product.id,
                                name: product.name,
                                quantity: product.quantity,
                                expiryDate: dateToProcess,
                                dateQty: knownQty,
                                processedDate: new Date().toISOString().split('T')[0],
                                status: status,
                                notes: notes,
                                unitsRemoved: finalQty
                            };
                            this.processedItems.push(processedItem);

                            product.dates = product.dates.filter(d => d.date !== dateToProcess);
                            if (product.dates.length === 0) {
                                product.removed = true;
                            }

                            this.saveProducts();
                            this.saveProcessedItems();
                            this.updateStats();
                            this.render();
                        });
                    });
                });
            },

            generateProcessedId() {
                return this.processedItems.length > 0
                    ? Math.max(...this.processedItems.map(pi => pi.id), 0) + 1
                    : 1;
            },

            attachEditButtonListeners() {
                document.querySelectorAll('.edit-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.preventDefault();
                        const id = parseInt(btn.dataset.id);
                        this.openEditModal(id);
                    });
                });
            },

            attachProcessedItemListeners() {
                document.querySelectorAll('.save-entry-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.preventDefault();
                        const id = parseInt(btn.dataset.id);
                        const item = this.processedItems.find(pi => pi.id === id);
                        if (!item) return;

                        const card = btn.closest('.processed-card');
                        const statusEl = card.querySelector('.processed-status');
                        const unitsEl = card.querySelector('.processed-units');
                        const notesEl = card.querySelector('.processed-notes');

                        item.status = statusEl.value;
                        item.unitsRemoved = unitsEl.value === '' ? null : parseInt(unitsEl.value, 10);
                        item.notes = notesEl.value;
                        this.saveProcessedItems();

                        const summaryEl = document.getElementById('processedSummary');
                        const filtered = this.getFilteredProcessedItems();
                        summaryEl.textContent = this.buildSummaryText(filtered);
                        this.refreshUnconfirmedBadge(item.id, item.unitsRemoved);

                        const needsCount = item.unitsRemoved === null || item.unitsRemoved === undefined || item.unitsRemoved === '';
                        const sublineEl = document.querySelector(`[data-subline-id="${item.id}"]`);
                        if (sublineEl) {
                            sublineEl.textContent = item.status
                                ? `${item.status}${needsCount ? '' : ` · ${item.unitsRemoved} unit${item.unitsRemoved === 1 ? '' : 's'}`}`
                                : 'Tap to add details';
                        }

                        const originalLabel = btn.textContent;
                        btn.textContent = 'Saved ✓';
                        btn.classList.add('saved');
                        setTimeout(() => {
                            btn.textContent = originalLabel;
                            btn.classList.remove('saved');
                        }, 1400);
                    });
                });

                document.querySelectorAll('.restore-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.preventDefault();
                        const id = parseInt(btn.dataset.id);
                        const processedItem = this.processedItems.find(pi => pi.id === id);
                        
                        if (processedItem) {
                            // Fall back to processedItem.id for entries saved before
                            // productId was tracked separately.
                            const productId = processedItem.productId ?? processedItem.id;
                            const product = this.products.find(p => p.id === productId);
                            if (product) {
                                // Re-activate the product
                                product.removed = false;
                                // Add back the processed date, restoring its known
                                // quantity if this entry has one on record.
                                if (!product.dates.some(d => d.date === processedItem.expiryDate)) {
                                    product.dates.push({ date: processedItem.expiryDate, qty: processedItem.dateQty ?? null });
                                    product.dates.sort((a, b) => new Date(a.date) - new Date(b.date));
                                }
                            }
                            // Remove from processed items
                            this.processedItems = this.processedItems.filter(pi => pi.id !== id);
                            this.saveProducts();
                            this.saveProcessedItems();
                            this.updateStats();
                            this.render();
                        }
                    });
                });
            },

            openEditModal(productId) {
                const product = this.products.find(p => p.id === productId);
                if (!product) return;

                this.editingProductId = productId;
                this.editTempDates = product.dates.map(entry => ({ ...entry }));

                document.getElementById('editProductName').value = product.name;
                document.getElementById('editProductQuantity').value = product.quantity;

                this.renderEditDatesList();
                document.getElementById('editModal').classList.add('active');
            },

            renderEditDatesList() {
                const container = document.getElementById('editDatesList');
                container.innerHTML = '';

                this.editTempDates.forEach((entry, index) => {
                    const dateDiv = document.createElement('div');
                    dateDiv.className = 'date-item';
                    dateDiv.innerHTML = `
                        <div class="date-item-row">
                            <input 
                                type="date" 
                                class="edit-date-input"
                                value="${entry.date}"
                                data-index="${index}"
                                style="flex: 1; padding: 0.5rem 0.75rem; border: 1px solid #DCDCD5; border-radius: 8px; font-size: 0.95rem; font-family: inherit;"
                            >
                            <button type="button" class="remove-date-btn" data-index="${index}">✕</button>
                        </div>
                        <div class="date-item-row">
                            <input
                                type="number"
                                min="0"
                                inputmode="numeric"
                                class="edit-date-qty-input date-qty-input"
                                data-index="${index}"
                                placeholder="qty"
                                value="${entry.qty ?? ''}"
                            >
                        </div>
                    `;
                    container.appendChild(dateDiv);
                });

                // Attach listeners to date inputs
                document.querySelectorAll('#editDatesList .edit-date-input').forEach(input => {
                    input.addEventListener('change', (e) => {
                        const index = parseInt(e.target.dataset.index);
                        if (e.target.value) {
                            this.editTempDates[index].date = e.target.value;
                            this.editTempDates.sort((a, b) => new Date(a.date) - new Date(b.date));
                            this.renderEditDatesList();
                        } else {
                            // If emptied, remove it
                            this.editTempDates.splice(index, 1);
                            this.renderEditDatesList();
                        }
                    });
                });

                // Attach listeners to per-date quantity inputs
                document.querySelectorAll('#editDatesList .edit-date-qty-input').forEach(input => {
                    input.addEventListener('input', (e) => {
                        const index = parseInt(e.target.dataset.index);
                        this.editTempDates[index].qty = e.target.value === '' ? null : parseInt(e.target.value, 10);
                    });
                });

                document.querySelectorAll('#editDatesList .remove-date-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.preventDefault();
                        const index = parseInt(btn.dataset.index);
                        this.editTempDates.splice(index, 1);
                        this.renderEditDatesList();
                    });
                });
            },

            updateStats() {
                const total = this.products.filter(p => !p.removed).length;
                const expiring = this.products.filter(p => {
                    if (p.removed) return false;
                    const earliest = this.getEarliestDate(p.dates);
                    if (!earliest) return false;
                    const daysUntil = this.getDaysUntilExpiry(earliest.date);
                    return this.isExpiringCritical(daysUntil);
                }).length;
                const processed = this.processedItems.length;

                document.getElementById('expiringTabCount').textContent = expiring;
                document.getElementById('allTabCount').textContent = total;
                document.getElementById('processedTabCount').textContent = processed;
            },

            attachEventListeners() {
                // Tab switching
                document.getElementById('expiringTab').addEventListener('click', () => {
                    this.currentView = 'expiring';
                    this.searchQuery = '';
                    document.getElementById('searchInput').value = '';
                    this.updateTabButtons();
                    this.render();
                });

                document.getElementById('allTab').addEventListener('click', () => {
                    this.currentView = 'all';
                    this.searchQuery = '';
                    document.getElementById('searchInput').value = '';
                    this.updateTabButtons();
                    this.render();
                });

                document.getElementById('processedTab').addEventListener('click', () => {
                    this.currentView = 'processed';
                    this.searchQuery = '';
                    document.getElementById('searchInput').value = '';
                    this.updateTabButtons();
                    this.render();
                });

                // Search
                document.getElementById('searchInput').addEventListener('input', (e) => {
                    this.searchQuery = e.target.value;
                    this.render();
                });

                // Processed date range filters
                document.querySelectorAll('.date-filter-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.processedDateFilter = e.target.dataset.range;
                        document.querySelectorAll('.date-filter-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.renderProcessedItems();
                    });
                });

                // Add product modal
                const addModal = document.getElementById('addModal');
                const addBtn = document.getElementById('addBtn');
                const addCancelBtn = document.getElementById('cancelBtn');
                const addForm = document.getElementById('addForm');

                addBtn.addEventListener('click', () => {
                    this.tempDates = [];
                    document.getElementById('datesList').innerHTML = '';
                    addForm.reset();
                    addModal.classList.add('active');
                });

                addCancelBtn.addEventListener('click', () => {
                    addModal.classList.remove('active');
                    addForm.reset();
                    this.tempDates = [];
                });

                addModal.addEventListener('click', (e) => {
                    if (e.target === addModal) {
                        addModal.classList.remove('active');
                        addForm.reset();
                        this.tempDates = [];
                    }
                });

                document.getElementById('addDateBtn').addEventListener('click', (e) => {
                    e.preventDefault();
                    // Add empty date and auto-focus to open picker
                    this.tempDates.push({ date: '', qty: null });
                    this.renderDatesList();
                    // Auto-focus and open the picker on the new input
                    setTimeout(() => {
                        const inputs = document.querySelectorAll('#datesList .add-date-input');
                        if (inputs.length > 0) {
                            inputs[inputs.length - 1].click();
                        }
                    }, 0);
                });

                addForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const name = document.getElementById('productName').value.trim();
                    const quantity = document.getElementById('productQuantity').value.trim();
                    const validDates = this.tempDates.filter(entry => entry.date);

                    if (name && quantity && validDates.length > 0) {
                        const newProduct = {
                            id: Math.max(...this.products.map(p => p.id), 0) + 1,
                            name,
                            quantity,
                            dates: validDates.map(entry => ({ ...entry })),
                            removed: false
                        };

                        this.products.push(newProduct);
                        this.sortProductsAlphabetically();
                        this.saveProducts();
                        this.updateStats();
                        this.render();
                        addModal.classList.remove('active');
                        addForm.reset();
                        this.tempDates = [];
                    }
                });

                // Edit product modal
                const editModal = document.getElementById('editModal');
                const editCancelBtn = document.getElementById('editCancelBtn');
                const editForm = document.getElementById('editForm');

                editCancelBtn.addEventListener('click', () => {
                    editModal.classList.remove('active');
                    this.editingProductId = null;
                    this.editTempDates = [];
                });

                editModal.addEventListener('click', (e) => {
                    if (e.target === editModal) {
                        editModal.classList.remove('active');
                        this.editingProductId = null;
                        this.editTempDates = [];
                    }
                });

                document.getElementById('editAddDateBtn').addEventListener('click', (e) => {
                    e.preventDefault();
                    // Add empty date and auto-focus to open picker
                    this.editTempDates.push({ date: '', qty: null });
                    this.renderEditDatesList();
                    // Auto-focus and open the picker on the new input
                    setTimeout(() => {
                        const inputs = document.querySelectorAll('#editDatesList .edit-date-input');
                        if (inputs.length > 0) {
                            inputs[inputs.length - 1].click();
                        }
                    }, 0);
                });

                editForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const name = document.getElementById('editProductName').value.trim();
                    const quantity = document.getElementById('editProductQuantity').value.trim();
                    const validDates = this.editTempDates.filter(entry => entry.date);

                    // Validation
                    if (!name) {
                        alert('Please enter a product name');
                        return;
                    }
                    if (!quantity) {
                        alert('Please enter a quantity');
                        return;
                    }
                    if (validDates.length === 0) {
                        alert('Please add at least one expiry date');
                        return;
                    }

                    // Save the product
                    const product = this.products.find(p => p.id === this.editingProductId);
                    if (product) {
                        product.name = name;
                        product.quantity = quantity;
                        product.dates = validDates.map(entry => ({ ...entry }));
                        this.sortProductsAlphabetically();
                        this.saveProducts();
                        this.updateStats();
                        this.render();
                    }

                    // Close the modal
                    editModal.classList.remove('active');
                    this.editingProductId = null;
                    this.editTempDates = [];
                });
            },

            renderDatesList() {
                const container = document.getElementById('datesList');
                container.innerHTML = '';

                this.tempDates.forEach((entry, index) => {
                    const dateDiv = document.createElement('div');
                    dateDiv.className = 'date-item';
                    dateDiv.innerHTML = `
                        <div class="date-item-row">
                            <input 
                                type="date" 
                                class="add-date-input"
                                value="${entry.date}"
                                data-index="${index}"
                                style="flex: 1; padding: 0.5rem 0.75rem; border: 1px solid #DCDCD5; border-radius: 8px; font-size: 0.95rem; font-family: inherit;"
                            >
                            <button type="button" class="remove-date-btn" data-index="${index}">✕</button>
                        </div>
                        <div class="date-item-row">
                            <input
                                type="number"
                                min="0"
                                inputmode="numeric"
                                class="add-date-qty-input date-qty-input"
                                data-index="${index}"
                                placeholder="qty"
                                value="${entry.qty ?? ''}"
                            >
                        </div>
                    `;
                    container.appendChild(dateDiv);
                });

                // Attach listeners to date inputs
                document.querySelectorAll('#datesList .add-date-input').forEach(input => {
                    input.addEventListener('change', (e) => {
                        const index = parseInt(e.target.dataset.index);
                        if (e.target.value) {
                            this.tempDates[index].date = e.target.value;
                            this.tempDates.sort((a, b) => new Date(a.date) - new Date(b.date));
                            this.renderDatesList();
                        } else {
                            // If emptied, remove it
                            this.tempDates.splice(index, 1);
                            this.renderDatesList();
                        }
                    });
                });

                // Attach listeners to per-date quantity inputs
                document.querySelectorAll('#datesList .add-date-qty-input').forEach(input => {
                    input.addEventListener('input', (e) => {
                        const index = parseInt(e.target.dataset.index);
                        this.tempDates[index].qty = e.target.value === '' ? null : parseInt(e.target.value, 10);
                    });
                });

                document.querySelectorAll('#datesList .remove-date-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.preventDefault();
                        const index = parseInt(btn.dataset.index);
                        this.tempDates.splice(index, 1);
                        this.renderDatesList();
                    });
                });
            },

            updateTabButtons() {
                const expiringTab = document.getElementById('expiringTab');
                const allTab = document.getElementById('allTab');
                const processedTab = document.getElementById('processedTab');

                expiringTab.classList.toggle('inactive', this.currentView !== 'expiring');
                allTab.classList.toggle('inactive', this.currentView !== 'all');
                processedTab.classList.toggle('inactive', this.currentView !== 'processed');
            }
        };

        // Start app when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
</html>
